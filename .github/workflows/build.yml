name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.game.casesimulator CaseSimulator
          cd myApp
          cordova platform add android

      - name: Copy Web Files to Cordova
        run: |
          rm -rf myApp/www/*
          cp index.html myApp/www/
          cp *.jpg myApp/www/ || true
          [ -f config.xml ] && cp config.xml myApp/ || true
          [ -f icon.png ] && cp icon.png myApp/ || true

      - name: Build APK (Release)
        run: |
          cd myApp
          cordova build android --release || cordova build android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: myApp/platforms/android/app/build/outputs/apk/**/*.apk
          
